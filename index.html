<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada sin Marcadores - WebAR</title>
  
  <!-- Three.js para renderizado 3D de alto rendimiento -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Video de la cámara de fondo */
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(1); /* Dinámico según cámara frontal o trasera */
      transition: transform 0.3s ease;
    }

    /* Canvas 3D de Three.js sobrepuesto */
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }

    /* Barra Superior */
    #top-bar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .status-pill {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .round-btn {
      pointer-events: auto;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .round-btn:active {
      transform: scale(0.92);
      background: #3b82f6;
    }

    /* Barra Inferior y Selector de Categorías */
    #bottom-container {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    /* Selector de pestañas: Figuras, Personajes, Filtros */
    .tab-pills {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 25px;
      display: flex;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.5);
    }

    /* Carrusel de elementos seleccionables */
    .items-scroll {
      pointer-events: auto;
      display: flex;
      gap: 10px;
      max-width: 95vw;
      overflow-x: auto;
      padding: 6px 12px;
      scrollbar-width: none;
    }
    .items-scroll::-webkit-scrollbar {
      display: none;
    }

    .item-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      min-width: 80px;
    }

    .item-card .icon {
      font-size: 22px;
    }

    .item-card.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }

    /* Mensaje guía flotante */
    #hint-toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #e2e8f0;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.4s;
    }

    /* Modal de permisos de cámara */
    #permission-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      color: white;
    }

    #permission-modal h2 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    #permission-modal p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 320px;
    }

    .btn-grant {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Elemento de Video para la Cámara del Teléfono -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- Canvas WebGL 3D -->
  <div id="three-canvas"></div>

  <!-- Barra Superior -->
  <div id="top-bar">
    <div class="status-pill">
      <span id="camera-label">📷 Trasera</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <!-- Botón para alternar sensores de giroscopio/rotación -->
      <button class="round-btn" id="btn-gyro" title="Giroscopio / AR">🧭</button>
      <!-- Botón para Cambiar entre Cámara Frontal y Trasera -->
      <button class="round-btn" id="btn-switch-cam" title="Cambiar Cámara">🔄</button>
    </div>
  </div>

  <div id="hint-toast">Toca y arrastra para rotar • Pellizca para tamaño</div>

  <!-- Barra Inferior -->
  <div id="bottom-container">
    <!-- Pestañas -->
    <div class="tab-pills">
      <button class="tab-btn active" onclick="cambiarCategoria('figuras')">🔷 Figuras</button>
      <button class="tab-btn" onclick="cambiarCategoria('personajes')">🤖 Personajes</button>
      <button class="tab-btn" onclick="cambiarCategoria('filtros')">🎭 Filtros</button>
    </div>

    <!-- Carrusel dinámico de opciones -->
    <div class="items-scroll" id="items-list">
      <!-- Se llena por JavaScript -->
    </div>
  </div>

  <!-- Modal para solicitar permisos si fue bloqueado -->
  <div id="permission-modal">
    <h2>Se requiere la cámara</h2>
    <p>Para ver la Realidad Aumentada sin marcadores, por favor concede permiso de acceso a la cámara de tu celular.</p>
    <button class="btn-grant" onclick="iniciarCamara()">Permitir Cámara</button>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURACIÓN DE CÁMARA (FRONTAL / TRASERA)
    // ==========================================
    let currentFacingMode = 'environment'; // 'environment' (trasera) o 'user' (frontal)
    let videoStream = null;
    const video = document.getElementById('camera-video');
    const cameraLabel = document.getElementById('camera-label');

    async function iniciarCamara() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        audio: false,
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = videoStream;
        await video.play();
        document.getElementById('permission-modal').style.display = 'none';

        // Espejo en cámara frontal para efecto natural de selfie
        if (currentFacingMode === 'user') {
          video.style.transform = 'scaleX(-1)';
          cameraLabel.innerText = '🤳 Selfie / Filtro';
        } else {
          video.style.transform = 'scaleX(1)';
          cameraLabel.innerText = '📷 Trasera / Mundo';
        }
      } catch (err) {
        console.error('Error accediendo a la cámara:', err);
        document.getElementById('permission-modal').style.display = 'flex';
      }
    }

    document.getElementById('btn-switch-cam').addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      iniciarCamara();
    });

    // ==========================================
    // 2. CONFIGURACIÓN DE THREE.JS (ESCENA 3D)
    // ==========================================
    const container = document.getElementById('three-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.5);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // Luces dinámicas
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x38bdf8, 2.0);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xf43f5e, 1.5);
    dirLight2.position.set(-5, -5, 5);
    scene.add(dirLight2);

    // Contenedor principal del objeto activo
    const rootAnchor = new THREE.Group();
    scene.add(rootAnchor);

    // ==========================================
    // 3. CATÁLOGO DE MODELOS Y GENERACIÓN 3D
    // ==========================================
    let activeObject = null;
    let animLoopFunc = null;

    // A. FIGURAS GEOMÉTRICAS 3D
    function crearHipercubo() {
      const group = new THREE.Group();
      
      // Cubo exterior transparente
      const geomExt = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const matExt = new THREE.MeshPhysicalMaterial({
        color: 0x06b6d4,
        roughness: 0.1,
        transmission: 0.8,
        thickness: 0.5,
        wireframe: false,
        transparent: true,
        opacity: 0.6
      });
      const boxExt = new THREE.Mesh(geomExt, matExt);
      group.add(boxExt);

      // Líneas de aristas brillantes
      const edges = new THREE.EdgesGeometry(geomExt);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 }));
      group.add(line);

      // Núcleo octaédrico interior
      const geomInt = new THREE.OctahedronGeometry(0.5, 0);
      const matInt = new THREE.MeshStandardMaterial({
        color: 0xf43f5e,
        emissive: 0xe11d48,
        emissiveIntensity: 0.8,
        metalness: 0.8,
        roughness: 0.2
      });
      const boxInt = new THREE.Mesh(geomInt, matInt);
      group.add(boxInt);

      animLoopFunc = (t) => {
        boxExt.rotation.x = t * 0.8;
        boxExt.rotation.y = t * 1.1;
        line.rotation.x = t * 0.8;
        line.rotation.y = t * 1.1;
        boxInt.rotation.x = -t * 1.5;
        boxInt.rotation.z = t * 1.3;
        const scale = 0.5 + Math.sin(t * 3) * 0.1;
        boxInt.scale.set(scale, scale, scale);
      };
      return group;
    }

    function crearCristalCosmico() {
      const group = new THREE.Group();
      const geom = new THREE.IcosahedronGeometry(0.85, 0);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x8b5cf6,
        roughness: 0.1,
        metalness: 0.9,
        emissive: 0x4c1d95,
        emissiveIntensity: 0.5,
        flatShading: true
      });
      const cristal = new THREE.Mesh(geom, mat);
      group.add(cristal);

      // Anillo orbital giratorio
      const ringGeom = new THREE.TorusGeometry(1.2, 0.04, 16, 64);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xb45309, metalness: 0.9 });
      const ring = new THREE.Mesh(ringGeom, ringMat);
      ring.rotation.x = Math.PI / 3;
      group.add(ring);

      animLoopFunc = (t) => {
        cristal.rotation.y = t * 1.2;
        cristal.rotation.z = t * 0.6;
        ring.rotation.z = -t * 1.8;
        group.position.y = Math.sin(t * 2) * 0.15;
      };
      return group;
    }

    function crearToroidePortal() {
      const group = new THREE.Group();
      const geom = new THREE.TorusKnotGeometry(0.65, 0.2, 100, 16);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x10b981,
        metalness: 0.8,
        roughness: 0.15,
        emissive: 0x064e3b,
        emissiveIntensity: 0.6
      });
      const torus = new THREE.Mesh(geom, mat);
      group.add(torus);

      animLoopFunc = (t) => {
        torus.rotation.x = t * 0.9;
        torus.rotation.y = t * 1.4;
      };
      return group;
    }

    // B. PERSONAJES 3D
    function crearRobotCyberBot() {
      const robot = new THREE.Group();

      // Cabeza
      const headGeom = new THREE.BoxGeometry(0.7, 0.6, 0.6);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8, roughness: 0.2 });
      const head = new THREE.Mesh(headGeom, bodyMat);
      head.position.y = 0.55;
      robot.add(head);

      // Ojos LED brillantes
      const eyeGeom = new THREE.CylinderGeometry(0.09, 0.09, 0.1, 16);
      eyeGeom.rotateX(Math.PI / 2);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
      const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
      leftEye.position.set(-0.18, 0.58, 0.31);
      const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
      rightEye.position.set(0.18, 0.58, 0.31);
      robot.add(leftEye, rightEye);

      // Antena
      const antGeom = new THREE.CylinderGeometry(0.02, 0.02, 0.3);
      const ant = new THREE.Mesh(antGeom, new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9 }));
      ant.position.set(0, 0.95, 0);
      const antBall = new THREE.Mesh(new THREE.SphereGeometry(0.06), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
      antBall.position.set(0, 1.1, 0);
      robot.add(ant, antBall);

      // Torso
      const torsoGeom = new THREE.BoxGeometry(0.8, 0.8, 0.5);
      const torso = new THREE.Mesh(torsoGeom, new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.6, roughness: 0.3 }));
      torso.position.y = -0.15;
      robot.add(torso);

      // Núcleo en el pecho
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      core.position.set(0, -0.1, 0.26);
      robot.add(core);

      // Brazos flotantes articulados
      const armGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.6);
      const leftArm = new THREE.Mesh(armGeom, bodyMat);
      leftArm.position.set(-0.55, -0.15, 0);
      const rightArm = new THREE.Mesh(armGeom, bodyMat);
      rightArm.position.set(0.55, -0.15, 0);
      robot.add(leftArm, rightArm);

      animLoopFunc = (t) => {
        robot.position.y = Math.sin(t * 3) * 0.12; // Flotación
        head.rotation.y = Math.sin(t * 1.5) * 0.35; // Mirar a los lados
        leftArm.rotation.x = Math.sin(t * 3) * 0.4;
        rightArm.rotation.x = Math.sin(t * 3 + Math.PI) * 0.4; // Saludo
        const pulse = 1 + Math.sin(t * 6) * 0.2;
        core.scale.set(pulse, pulse, pulse);
        antBall.visible = Math.sin(t * 5) > -0.5; // Parpadeo antena
      };
      return robot;
    }

    function crearDronExplorador() {
      const drone = new THREE.Group();

      // Esfera central
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.1 })
      );
      drone.add(sphere);

      // Ojo visor cibernético
      const visor = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xef4444 })
      );
      visor.position.set(0, 0.05, 0.38);
      drone.add(visor);

      // 4 Rotores
      const rotors = [];
      const angles = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2];
      angles.forEach((ang) => {
        const arm = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.03, 0.5),
          new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8 })
        );
        arm.rotation.z = Math.PI / 2;
        arm.rotation.y = ang;
        arm.position.set(Math.cos(ang) * 0.45, 0, Math.sin(ang) * 0.45);
        drone.add(arm);

        const propGeom = new THREE.BoxGeometry(0.35, 0.02, 0.06);
        const propMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const prop = new THREE.Mesh(propGeom, propMat);
        prop.position.set(Math.cos(ang) * 0.7, 0.08, Math.sin(ang) * 0.7);
        drone.add(prop);
        rotors.push(prop);
      });

      animLoopFunc = (t) => {
        drone.position.y = Math.sin(t * 3.5) * 0.1;
        drone.rotation.y = Math.sin(t * 0.8) * 0.4;
        drone.rotation.z = Math.cos(t * 2) * 0.08;
        rotors.forEach(r => r.rotation.y += 0.5);
      };
      return drone;
    }

    // C. FILTROS FACIALES / OVERLAYS AR
    function crearGafasCyberpunk() {
      const glasses = new THREE.Group();

      // Montura
      const frameGeom = new THREE.BoxGeometry(1.4, 0.35, 0.1);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.2 });
      const frame = new THREE.Mesh(frameGeom, frameMat);
      glasses.add(frame);

      // Lentes de Neón Hexagonales
      const lensGeom = new THREE.BoxGeometry(0.55, 0.28, 0.08);
      const lensMat = new THREE.MeshStandardMaterial({
        color: 0x00f0ff,
        emissive: 0x00e1ff,
        emissiveIntensity: 0.7,
        transparent: true,
        opacity: 0.8,
        metalness: 0.5,
        roughness: 0.1
      });
      const leftLens = new THREE.Mesh(lensGeom, lensMat);
      leftLens.position.set(-0.35, 0, 0.03);
      const rightLens = new THREE.Mesh(lensGeom, lensMat);
      rightLens.position.set(0.35, 0, 0.03);
      glasses.add(leftLens, rightLens);

      // Patillas
      const armGeom = new THREE.BoxGeometry(0.05, 0.1, 0.9);
      const leftArm = new THREE.Mesh(armGeom, frameMat);
      leftArm.position.set(-0.68, 0, -0.45);
      const rightArm = new THREE.Mesh(armGeom, frameMat);
      rightArm.position.set(0.68, 0, -0.45);
      glasses.add(leftArm, rightArm);

      // Si es cámara frontal se acomoda a la altura de los ojos
      glasses.position.set(0, 0.1, 0);

      animLoopFunc = (t) => {
        // Pulso de color cibernético
        const hue = (t * 0.2) % 1;
        lensMat.color.setHSL(hue, 1, 0.5);
        lensMat.emissive.setHSL(hue, 1, 0.5);
      };
      return glasses;
    }

    function crearCoronaReal() {
      const crown = new THREE.Group();
      
      // Base de la corona
      const baseGeom = new THREE.CylinderGeometry(0.65, 0.75, 0.25, 32, 1, true);
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        metalness: 0.9,
        roughness: 0.15,
        emissive: 0x854d0e,
        emissiveIntensity: 0.3
      });
      const base = new THREE.Mesh(baseGeom, goldMat);
      crown.add(base);

      // Puntas de la corona
      for (let i = 0; i < 7; i++) {
        const ang = (i / 7) * Math.PI * 2;
        const spikeGeom = new THREE.ConeGeometry(0.12, 0.45, 16);
        const spike = new THREE.Mesh(spikeGeom, goldMat);
        spike.position.set(Math.cos(ang) * 0.65, 0.3, Math.sin(ang) * 0.65);
        crown.add(spike);

        // Gemas de rubí en las puntas
        const gemGeom = new THREE.SphereGeometry(0.06, 12, 12);
        const gemMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b, metalness: 0.8 });
        const gem = new THREE.Mesh(gemGeom, gemMat);
        gem.position.set(Math.cos(ang) * 0.65, 0.52, Math.sin(ang) * 0.65);
        crown.add(gem);
      }

      crown.position.set(0, 0.9, 0); // Flotando sobre la cabeza

      animLoopFunc = (t) => {
        crown.rotation.y = t * 0.6;
        crown.position.y = 0.9 + Math.sin(t * 2) * 0.08;
      };
      return crown;
    }

    function crearMascaraSciFi() {
      const mask = new THREE.Group();

      // Respirador frontal
      const ventGeom = new THREE.CylinderGeometry(0.25, 0.35, 0.4, 6);
      ventGeom.rotateX(Math.PI / 2);
      const ventMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.3 });
      const vent = new THREE.Mesh(ventGeom, ventMat);
      vent.position.set(0, -0.2, 0.3);
      mask.add(vent);

      // Visor holográfico curvado
      const visorGeom = new THREE.TorusGeometry(0.65, 0.1, 16, 32, Math.PI);
      const visorMat = new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true });
      const visor = new THREE.Mesh(visorGeom, visorMat);
      visor.position.set(0, 0.15, 0.2);
      visor.rotation.z = Math.PI;
      mask.add(visor);

      animLoopFunc = (t) => {
        visor.rotation.y = Math.sin(t * 2) * 0.15;
      };
      return mask;
    }

    // ==========================================
    // 4. GESTIÓN DE ELEMENTOS EN ESCENA
    // ==========================================
    const categorias = {
      figuras: [
        { id: 'hipercubo', nombre: 'Hipercubo', icon: '🧊', fn: crearHipercubo },
        { id: 'cristal', nombre: 'Cristal Cósmico', icon: '💎', fn: crearCristalCosmico },
        { id: 'portal', nombre: 'Toroide Neón', icon: '🌀', fn: crearToroidePortal }
      ],
      personajes: [
        { id: 'cyberbot', nombre: 'Robot CyberBot', icon: '🤖', fn: crearRobotCyberBot },
        { id: 'dron', nombre: 'Dron Explorador', icon: '🛸', fn: crearDronExplorador }
      ],
      filtros: [
        { id: 'gafas', nombre: 'Lentes Cyber', icon: '🕶️', fn: crearGafasCyberpunk },
        { id: 'corona', nombre: 'Corona Real', icon: '👑', fn: crearCoronaReal },
        { id: 'mascara', nombre: 'Máscara Sci-Fi', icon: '👺', fn: crearMascaraSciFi }
      ]
    };

    let catActual = 'figuras';
    let idSeleccionado = 'hipercubo';

    function seleccionarElemento(id, fnCreacion) {
      idSeleccionado = id;
      
      // Limpiar objeto anterior
      if (activeObject) {
        rootAnchor.remove(activeObject);
      }
      animLoopFunc = null;

      // Resetear posición del ancla
      rootAnchor.position.set(0, 0, 0);
      rootAnchor.rotation.set(0, 0, 0);
      rootAnchor.scale.set(1, 1, 1);

      // Crear nuevo objeto
      activeObject = fnCreacion();
      rootAnchor.add(activeObject);

      // Actualizar estilo activo en lista
      document.querySelectorAll('.item-card').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });
    }

    function cambiarCategoria(catKey) {
      catActual = catKey;
      
      // Actualizar pestañas activas
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (catKey === 'figuras' && idx === 0) || (catKey === 'personajes' && idx === 1) || (catKey === 'filtros' && idx === 2));
      });

      // Si selecciona filtros y está en cámara trasera, sugerir o cambiar a selfie
      if (catKey === 'filtros' && currentFacingMode === 'environment') {
        const toast = document.getElementById('hint-toast');
        toast.innerText = '💡 Consejo: Cambia a la cámara frontal para usar los filtros';
        toast.style.background = 'rgba(234, 88, 12, 0.85)';
        setTimeout(() => {
          toast.innerText = 'Toca y arrastra para rotar • Pellizca para tamaño';
          toast.style.background = 'rgba(0, 0, 0, 0.7)';
        }, 4000);
      }

      // Renderizar carrusel
      const listContainer = document.getElementById('items-list');
      listContainer.innerHTML = '';

      categorias[catKey].forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.id === idSeleccionado ? 'active' : ''}`;
        card.dataset.id = item.id;
        card.innerHTML = `<span class="icon">${item.icon}</span><span>${item.nombre}</span>`;
        card.onclick = () => seleccionarElemento(item.id, item.fn);
        listContainer.appendChild(card);
      });

      // Seleccionar el primero de la categoría si no está el actual
      const existe = categorias[catKey].find(it => it.id === idSeleccionado);
      if (!existe) {
        seleccionarElemento(categorias[catKey][0].id, categorias[catKey][0].fn);
      }
    }

    // ==========================================
    // 5. INTERACTIVIDAD TÁCTIL (ROTAR / ESCALAR)
    // ==========================================
    let isDragging = false;
    let prevMousePos = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialScale = 1;

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#bottom-container') || e.target.closest('#top-bar')) return;
      if (e.touches.length === 1) {
        isDragging = true;
        prevMousePos.x = e.touches[0].clientX;
        prevMousePos.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = rootAnchor.scale.x;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        const deltaX = e.touches[0].clientX - prevMousePos.x;
        const deltaY = e.touches[0].clientY - prevMousePos.y;

        rootAnchor.rotation.y += deltaX * 0.01;
        rootAnchor.rotation.x += deltaY * 0.01;

        prevMousePos.x = e.touches[0].clientX;
        prevMousePos.y = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialPinchDist) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialPinchDist;
        const newScale = Math.max(0.3, Math.min(3.0, initialScale * factor));
        rootAnchor.scale.set(newScale, newScale, newScale);
      }
    });

    window.addEventListener('touchend', () => {
      isDragging = false;
      initialPinchDist = null;
    });

    // Soporte para ratón en escritorio
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('#bottom-container') || e.target.closest('#top-bar')) return;
      isDragging = true;
      prevMousePos.x = e.clientX;
      prevMousePos.y = e.clientY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMousePos.x;
      const deltaY = e.clientY - prevMousePos.y;
      rootAnchor.rotation.y += deltaX * 0.01;
      rootAnchor.rotation.x += deltaY * 0.01;
      prevMousePos.x = e.clientX;
      prevMousePos.y = e.clientY;
    });
    window.addEventListener('mouseup', () => isDragging = false);

    // ==========================================
    // 6. GIROSCOPIO / ORIENTACIÓN DEL DISPOSITIVO
    // ==========================================
    let gyroActivo = false;
    const btnGyro = document.getElementById('btn-gyro');

    btnGyro.addEventListener('click', async () => {
      if (!gyroActivo) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const resp = await DeviceOrientationEvent.requestPermission();
            if (resp === 'granted') {
              activarGiroscopio();
            }
          } catch (e) {
            console.warn(e);
          }
        } else {
          activarGiroscopio();
        }
      } else {
        desactivarGiroscopio();
      }
    });

    function handleOrientation(event) {
      if (!gyroActivo) return;
      const beta = event.beta ? THREE.MathUtils.degToRad(event.beta - 45) : 0;
      const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
      camera.rotation.x = beta * 0.3;
      camera.rotation.y = gamma * 0.3;
    }

    function activarGiroscopio() {
      gyroActivo = true;
      btnGyro.style.background = '#3b82f6';
      window.addEventListener('deviceorientation', handleOrientation);
    }

    function desactivarGiroscopio() {
      gyroActivo = false;
      btnGyro.style.background = 'rgba(30, 41, 59, 0.85)';
      window.removeEventListener('deviceorientation', handleOrientation);
      camera.rotation.set(0, 0, 0);
    }

    // ==========================================
    // 7. CICLO DE ANIMACIÓN Y RENDER
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      if (animLoopFunc) {
        animLoopFunc(elapsedTime);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Iniciar todo
    cambiarCategoria('figuras');
    iniciarCamara();
    animate();
  </script>
</body>
</html>
